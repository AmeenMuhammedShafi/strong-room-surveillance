camera:
  source: 0
  resolution_width: 1280
  resolution_height: 720
  fps: 30
  buffer_size: 1  # Reduce latency

# Detection Settings
detection:
  person_confidence_threshold: 0.5
  face_confidence_threshold: 0.6
  face_recognition_threshold: 0.6  # Lower = stricter matching
  processing_fps: 5  # Process every Nth frame for performance
  
# Model Paths
models:
  person_detector: "models/yolov8n.onnx"
  face_detector: "models/face_detection.onnx"
  face_recognizer: "models/face_recognition.onnx"

# Alert Settings
alerts:
  enable_sound: true
  enable_hardware_relay: false  # GPIO relay for physical locks
  enable_webhook: false
  enable_logging: true
  
  # Intelligent Cooldown Map (per alert type, in seconds)
  cooldown_success: 5         # AUTH_SUCCESS throttled (avoid spam on repeated authorized access)
  cooldown_idle: 30           # NO_PERSON (throttle idle state reports)
  # UNAUTHORIZED, EXCESS_PEOPLE, SPOOFING_DETECTED: 0 (instant - critical alerts)
  
  # Email configuration (if enabled)
  email:
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "your-email@gmail.com"
    sender_password: "your-app-password"
    recipient_emails:
      - "security@company.com"
  
  # Webhook configuration (if enabled)
  webhook:
    url: "https://your-webhook-url.com/alert"
    headers:
      Authorization: "Bearer YOUR_TOKEN"

# Live Detection Settings (Production-Grade: Head Pose + Blink + Gaze + Landmark Motion)
liveness:
  enabled: true
  
  # Detection Methods (Weighted Combination)
  # - head_pose: 40% (Primary - detects natural head rotation)
  # - blink: 20% (Supporting - detects eye closure events)
  # - gaze: 20% (Supporting - detects eye movement/pupil position)
  # - landmark_motion: 20% (Supporting - detects micro-expressions)
  
  # Temporal Consensus Parameters
  consensus_frames: 5  # Analyze 5 frames for robust decision
  consensus_threshold: 0.60  # 60% of frames must be LIVE (3 of 5 frames)
  
  # Decision Threshold
  liveness_threshold: 0.45  # Individual frame liveness score threshold
  
  # Alert Management
  alert_on_spoof: true
  spoof_cooldown: 30  # Prevent spoof alert spam from same person
  
  # MediaPipe Face Mesh Configuration
  max_history: 30  # Frame history for temporal analysis
  verbose: false  # Detailed logging (set to true for debugging)

# Database
database:
  face_encodings_path: "database/face_encodings.pkl"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "logs/surveillance.log"
  max_file_size_mb: 50
  backup_count: 5

# Performance
performance:
  use_gpu: false  # Set to true if CUDA available
  num_threads: 4
  enable_frame_skip: true